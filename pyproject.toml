[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smdata"
version = "0.1.0"
description = "Gaussian process datasets with measured complexity, for testing GPR and KRR"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
eval = ["scikit-learn>=1.2"]
dev = ["pytest>=7", "scikit-learn>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "test_roll.py"]
